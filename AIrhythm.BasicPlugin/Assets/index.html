<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-rhythm</title><link rel="stylesheet" href="app.css"></head>
<body class="airhythm-root"><main class="shell"><header><div><div class="brand-line"><h1>AI-rhythm</h1><span id="appVersion" class="app-version">v0.0.0</span></div><p id="status">番組情報を確認しています</p></div><button id="refresh" type="button" class="refresh-button">更新</button></header>
<section class="summary" aria-label="いまの状況"><article><strong id="historyCount">0</strong><span>累積録画数</span></article><article><strong id="reservationCount">0</strong><span>予約総数</span></article></section>
<section class="panel analytics"><div class="panel-head"><div><h2>あなたの録画傾向</h2><p>分析できる録画実績を振り返る情報。おすすめ順位とは別です</p></div></div><div id="dashboardCharts" class="dashboard-grid"></div></section>
<section class="panel discovery discovery-primary"><div class="panel-head"><div><h2>見つける</h2><p>録画中・今夜・再放送・発見を目的別に探す</p></div></div><div id="discoveryHub" class="discovery-hub"></div></section>
<section class="panel recommendations-panel"><div class="panel-head"><div><h2>あなたへのおすすめ</h2><p>録画履歴・予約・設定など、PC内の情報を中心に選んだ候補</p></div><label>表示件数 <select id="limit"><option>10</option><option selected>20</option><option>30</option></select></label></div><div id="message" class="message" hidden></div><div id="recommendations" class="cards"></div></section>
<section class="panel rhythm-panel"><div class="panel-head"><div><h2>リズム検索</h2><p>番組名が決まっていなくても、気分・時間・目的から探す</p></div></div><div id="rhythmSearch" class="rhythm-search"></div></section>
<section class="panel settings"><h2>設定</h2>
<div class="settings-section recommendation-settings-section"><div class="settings-section-head"><strong>おすすめの調整</strong></div><div class="settings-section-body"><label class="settings-field"><span>優先する言葉</span><textarea id="preferred" placeholder="番組名や出演者などを改行で入力"></textarea></label><label class="settings-field"><span>除外する言葉</span><textarea id="excluded" placeholder="候補から外す言葉を改行で入力"></textarea></label><div class="actions settings-actions" aria-label="おすすめの調整の操作"><button id="save" type="button">保存</button><button id="reset" type="button" class="secondary">おすすめリセット</button></div></div></div><div id="settingsFormEnd"></div>
<div class="settings-section learning-data-section"><div class="settings-section-head"><strong>学習データ</strong></div><div class="settings-section-body"><button id="resetLearning" type="button" class="learning-reset">学習データリセット</button></div></div>
<div class="settings-section external-info-section"><div class="settings-section-head"><strong>外部情報</strong></div><div class="external-lookup-setting"><div class="external-lookup-copy"><strong>外部の番組・作品情報を利用する</strong></div><input id="externalLookupEnabled" type="hidden" value="false"><div class="external-lookup-control"><button id="externalLookupToggle" type="button" class="external-lookup-toggle">OFF</button><p id="externalLookupStatus" class="external-lookup-status"></p></div></div></div>
<div class="settings-section data-protection-section"><div class="settings-section-head"><strong>データの保全</strong></div><div id="dataMaintenanceActions" class="data-maintenance-actions"></div><div id="resetAccumulatedDataAction" class="complete-reset-action"></div></div></section>
</main><script src="app.js"></script></body></html>

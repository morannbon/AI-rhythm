<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-rhythm</title><link rel="stylesheet" href="app.css"></head>
<body class="airhythm-root"><main class="shell"><header><div><div class="brand-line"><h1>AI-rhythm</h1><span id="appVersion" class="app-version">v0.0.0</span></div><p id="status">番組情報を確認しています</p></div><button id="refresh" type="button" class="refresh-button">更新</button></header>
<section class="summary" aria-label="分析状況"><article><strong id="historyCount">0</strong><span>録画本数</span></article><article><strong id="reservationCount">0</strong><span>予約本数</span></article><article><strong id="programCount">0</strong><span>今から見られる</span></article></section>
<section class="panel analytics"><div class="panel-head"><div><h2>分析ダッシュボード</h2><p>録画実績から見えるあなたの傾向</p></div></div><div id="dashboardCharts" class="dashboard-grid"></div></section>
<section class="panel discovery"><div class="panel-head"><div><h2>発見ハブ</h2><p>放送中・録画済み・続きから見られる候補をまとめて探索</p></div></div><div id="discoveryHub" class="discovery-hub"></div></section>
<section class="panel rhythm-panel"><div class="panel-head"><div><h2>リズム検索</h2><p>番組名が決まっていなくても、気分・時間・目的から発見</p></div></div><div id="rhythmSearch" class="rhythm-search"></div></section>
<section class="panel"><div class="panel-head"><h2>おすすめ</h2><label>表示件数 <select id="limit"><option>10</option><option selected>20</option><option>30</option></select></label></div><div id="message" class="message" hidden></div><div id="recommendations" class="cards"></div></section>
<section class="panel"><h2>学習傾向</h2><div id="trends" class="trends"></div></section>
<section class="panel settings"><h2>設定</h2><label class="settings-field"><span>優先する言葉</span><textarea id="preferred" placeholder="番組名や出演者などを改行で入力"></textarea></label><label class="settings-field"><span>除外する言葉</span><textarea id="excluded" placeholder="候補から外す言葉を改行で入力"></textarea></label><div class="actions settings-actions"><button id="save" type="button">保存</button><div class="actions-right"><button id="reset" type="button" class="secondary">標準に戻す</button><button id="resetLearning" type="button" class="learning-reset">学習情報リセット</button></div></div></section>
</main><script src="app.js"></script></body></html>
